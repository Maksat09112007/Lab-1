<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проверка пароля</title>
<style>
body {
  font-family: Tahoma, Arial, sans-serif;
  background-color: #dfe8e6;
  margin: 0;
  padding: 30px;
}
.form {
  width: 380px;
  margin: 0 auto;
  background-color: white;
  border: 1px solid #777;
  padding: 20px;
}
h1 { font-size: 20px; margin-top: 0; }
#password {
  width: 95%;
  padding: 6px;
  font-size: 15px;
  border: 1px solid #555;
}
#bar {
  height: 12px;
  background-color: #ccc;
  margin-top: 10px;
}
#barFill { height: 12px; width: 0; }
ul { padding-left: 20px; }
.ok { color: green; }
.fail { color: red; }
#result { font-weight: bold; }
</style>
</head>
<body>
<div class="form">
  <h1>Проверка пароля</h1>
  <input type="password" id="password" placeholder="Введите пароль">
  <br>
  <input type="checkbox" id="toggle"> <label for="toggle">Показать пароль</label>
  <div id="bar"><div id="barFill"></div></div>
  <p id="strength"></p>
  <p>Требования:</p>
  <ul id="rules"></ul>
  <p id="result"></p>
</div>
<script src="script.js"></script>
</body>
</html>
