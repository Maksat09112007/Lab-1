<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабинет преподавателя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Кабинет преподавателя</h1>

    <section id="guest">
      <form id="loginForm" novalidate>
        <label>Логин <input id="login" autocomplete="username"></label>
        <label>Пароль <input id="password" type="password" autocomplete="current-password"></label>
        <button type="submit">Войти</button>
      </form>
    </section>

    <section id="cabinet" hidden>
      <p class="who">Вы вошли как <strong id="userName"></strong>, роль: <span id="userRole" class="badge"></span></p>
      <p class="timer">Сессия закончится через <strong id="timeLeft">--:--</strong></p>
      <div class="row">
        <button id="loadGroups" type="button">Мои группы</button>
        <button id="logout" type="button" class="secondary">Выйти</button>
      </div>
      <ul id="groups"></ul>
    </section>

    <p id="status" role="status"></p>
  </main>
  <script src="mock.js"></script>
  <script src="script.js"></script>
</body>
</html>
