<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Счетчик</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
  <h1>Счетчик</h1>
  <div id="value" class="zero">0</div>
  <button class="round" id="minus">-</button>
  <button class="round" id="plus">+</button>
  <button id="reset">Сброс</button>
  Шаг: <input type="number" id="step" value="1">
  <div id="message"></div>
  <p>История:</p>
  <ol id="history"></ol>
</div>
<script src="script.js"></script>
</body>
</html>
