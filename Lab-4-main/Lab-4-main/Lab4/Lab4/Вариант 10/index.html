<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Анкета сотрудника</title>
<link rel="stylesheet" href="style.css"></head><body>
<form id="staffForm" novalidate>
 <h1>Анкета сотрудника</h1>
 <label for="fio">ФИО</label>
 <input id="fio" type="text"><span class="error" id="fioError"></span>
 <label for="age">Возраст (18–70)</label>
 <input id="age" type="number"><span class="error" id="ageError"></span>
 <label for="dept">Отдел</label>
 <select id="dept"><option value="">Выберите отдел</option>
  <option>Разработка</option><option>Бухгалтерия</option><option>Маркетинг</option><option>HR</option></select>
 <span class="error" id="deptError"></span>
 <label>Формат работы</label>
 <label class="inline"><input type="radio" name="format" value="Офис"> Офис</label>
 <label class="inline"><input type="radio" name="format" value="Удалённо"> Удалённо</label>
 <label class="inline"><input type="radio" name="format" value="Гибрид"> Гибрид</label>
 <span class="error" id="formatError"></span>
 <div id="cityBox" hidden><label for="city">Город проживания</label>
  <input id="city" type="text"><span class="error" id="cityError"></span></div>
 <button type="submit">Отправить анкету</button>
 <p id="message"></p><div id="result"></div>
</form><script src="script.js"></script></body></html>
